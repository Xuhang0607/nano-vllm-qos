name: QoS control-plane tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install control-plane dependencies
        run: python -m pip install -r requirements-control.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check Python errors
        run: python -m ruff check --select F nanovllm benchmarks tests scripts
      - name: Run deterministic scheduler benchmark
        run: python -m benchmarks.benchmark_qos_scheduler
      - name: Run tiered-cache planner benchmark
        run: python -m benchmarks.benchmark_tiered_cache
